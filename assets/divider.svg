<svg width="1200" height="48" viewBox="0 0 1200 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated neon divider">
  <defs>
    <linearGradient id="g" x1="0" y1="24" x2="1200" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117" stop-opacity="0"/>
      <stop offset=".22" stop-color="#7C3AED"/>
      <stop offset=".5" stop-color="#22D3EE"/>
      <stop offset=".78" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#0D1117" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-200%" width="120%" height="500%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M0 24H1200" stroke="url(#g)" stroke-width="2" filter="url(#glow)"/>
  <circle cx="0" cy="24" r="5" fill="#22D3EE" filter="url(#glow)">
    <animate attributeName="cx" from="0" to="1200" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" repeatCount="indefinite"/>
  </circle>
</svg>

